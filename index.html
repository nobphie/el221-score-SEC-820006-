<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EL 221 Score Check</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#667085;--line:#e4e7ec;--bg:#f6f4ef;--card:#fff;--accent:#8a1c1c;--good:#1f7a4d}
*{box-sizing:border-box}body{margin:0;font-family:Sarabun,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
.wrap{width:100%;max-width:480px}
header{margin-bottom:22px}.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:30px;margin:4px 0 6px}p.sub{color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:8px}
.row{display:flex;gap:8px}
input{flex:1;font:inherit;font-size:18px;padding:11px 13px;border:1px solid #cfd4dc;border-radius:10px;letter-spacing:.06em}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 18px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:12px;font-size:14px;color:var(--accent);min-height:20px}
#result{margin-top:18px;display:none}
.id{font-size:14px;color:var(--muted);margin-bottom:10px}
table{width:100%;border-collapse:collapse}td{padding:10px 0;border-bottom:1px solid var(--line)}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}td.n span{color:var(--muted);font-weight:400}
.bar{height:6px;background:#eef0f3;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);opacity:.75}
tr.total td{border-bottom:0;padding-top:14px;font-size:20px;font-weight:700}tr.total td.n{color:var(--good)}
footer{margin-top:16px;font-size:12.5px;color:var(--muted);text-align:center}
</style></head><body><div class="wrap">
<header><div class="kicker">Language Institute · Thammasat University</div><h1>EL 221 Coursework Scores</h1><p class="sub">ตรวจสอบคะแนนเก็บ — enter your student ID to see your scores.</p></header>
<div class="card">
<form id="f"><label for="sid">Student ID / รหัสนักศึกษา</label>
<div class="row"><input id="sid" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="10 digits" required><button id="go">Check</button></div>
<div class="msg" id="msg" role="status"></div></form>
<div id="result"><div class="id" id="who"></div><table id="tbl"></table></div>
</div>
<footer>If a score looks wrong, please contact your instructor.</footer>
</div>

const ITEMS=[["A1","Assignment 1",15],["A2","Assignment 2",15],["A3","Assignment 3",15],["P","Participation",10],["A4","Assignment 4",20]];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=a=>[...a].map(x=>x.toString(16).padStart(2,"0")).join("");
const salt=b64(DATA.salt);
async function lookup(id){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(id),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:DATA.iter,hash:"SHA-256"},base,512));
  const rec=DATA.recs[hex(bits.slice(32))]; if(!rec) return null;
  const raw=b64(rec); const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
const fmt=n=>(Math.round(n*100)/100).toString();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const id=document.getElementById("sid").value.replace(/\D/g,""),msg=document.getElementById("msg"),res=document.getElementById("result"),btn=document.getElementById("go");
  res.style.display="none";msg.textContent="";
  if(id.length!==10){msg.textContent="Please enter all 10 digits of your student ID.";return}
  btn.disabled=true;btn.textContent="…";
  try{
    const s=await lookup(id);
    if(!s){msg.textContent="No scores found for this ID. Please check the number and try again.";return}
    let tot=0,max=0,rows="";
    for(const[k,name,m] of ITEMS){const v=parseFloat(s[k]);tot+=v;max+=m;
      rows+=`<tr><td>${name}<div class="bar"><i style="width:${Math.min(100,v/m*100)}%"></i></div></td><td class="n">${s[k]} <span>/ ${m}</span></td></tr>`}
    rows+=`<tr class="total"><td>Total</td><td class="n">${fmt(tot)} <span>/ ${max}</span></td></tr>`;
    document.getElementById("tbl").innerHTML=rows;document.getElementById("who").textContent="Student ID "+id;res.style.display="block";
  }catch(err){msg.textContent="Something went wrong. Please try again."}
  finally{btn.disabled=false;btn.textContent="Check"}
});
</script></body></html>
